backend:
  name: github
  repo: jacoblandis21321-create/bobbins-Co
  branch: main
media_folder: images
public_folder: /images
site_url: https://bowsandbobbinsco.com
display_url: https://bowsandbobbinsco.com
collections:
  - name: shop
    label: Shop
    files:
      - name: products
        label: Products
        file: products.json
        format: json
        fields:
          - label: Products
            name: products
            widget: list
            add_to_top: true
            summary: "{{fields.title}}"
            fields:
              - { label: Photo, name: image, widget: image }
              - { label: Name, name: title, widget: string }
              - { label: Short note (optional), name: note, widget: string, required: false }
              - { label: Fabric (what it is made of), name: fabric, widget: string, required: false, hint: "What is the garment made of? For example: cotton fleece, cotton jersey, cotton-poly blend" }
              - label: Categories
                name: categories
                widget: select
                multiple: true
                options: ["Fall","Summer","Christmas","Scalloped Sets","Mama","Baby & Kids","Game Day","Work & Career","Monograms","Appliqué","Faith","Names"]
              - { label: New category (optional), name: new_category, widget: string, required: false }
